<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - CampusFix 2.0</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .login-box {
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }

        .login-box h1 {
            margin-bottom: 8px;
        }

        .login-subtitle {
            margin-bottom: 25px;
            opacity: 0.85;
        }

        .login-box input {
            width: 100%;
            box-sizing: border-box;
            margin: 8px 0;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            outline: none;
            font-size: 15px;
        }

        .login-box button {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .login-tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.15);
        }

        .back-home {
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="login-tag">
                🎓 Student Portal
            </div>

            <h1>CampusFix 2.0</h1>

            <p class="login-subtitle">
                Login to report and track your campus problems.
            </p>

            <form id="loginForm">

                <input
                    type="text"
                    id="studentId"
                    placeholder="Roll Number"
                    required
                >

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login to CampusFix
                </button>

            </form>

            <p class="back-home">
                <a href="index.html">← Back to Home</a>
            </p>

        </div>

    </div>


    <script>

        const form = document.querySelector("#loginForm");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const studentId =
                document.querySelector("#studentId").value.trim();

            const name =
                document.querySelector("#name").value.trim();

            const password =
                document.querySelector("#password").value;

            try {

                const response = await fetch(
                    "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            studentId: studentId,
                            name: name,
                            password: password
                        })
                    }
                );

                const result = await response.json();

                alert(result.message);

                if (result.success) {

                    localStorage.setItem(
                        "studentId",
                        studentId
                    );

                    localStorage.setItem(
                        "studentName",
                        result.name
                    );

                    window.location.href =
                        "student-dashboard.html";

                }

            } catch (error) {

                console.log("Login Error:", error);

                alert("Cannot connect to server!");

            }

        });

    </script>

</body>

</html>
